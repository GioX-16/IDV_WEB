<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iglesia del Dios Viviente - IDV</title>
    <link rel="stylesheet" href="Styles/Style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="#inicio" class="logo-link">
                    <img src="images/LOGO_IDV.png" alt="Logo IDV" class="logo-image">
                </a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#aniversario" class="nav-link">Aniversario</a>
                </li>
                <li class="nav-item">
                    <a href="#iglesia" class="nav-link">Iglesia</a>
                </li>
                <li class="nav-item">
                    <a href="#unete" class="nav-link nav-btn">Únete</a>
                </li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="inicio" class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="title-line">Un Lugar Para</span>
                    <span class="title-line">Crecer en</span>
                    <span class="title-line">Fe y Amor</span>
                </h1>
                <button class="hero-btn">Conoce Nuestra Iglesia</button>
                <div class="church-seal">
                    <img src="images/Convencion LOGO.png" alt="Sello Iglesia" class="seal-image">
                </div>
            </div>
            <img src="images/Pastores.png" alt="Familia de la Iglesia" class="hero-photo">
        </div>
    </section>

    <script src="JS/index.js"></script>
</body>
</html>
