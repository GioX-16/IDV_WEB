<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E2A67">
  <title>Usuarios — IDV Admin</title>
  <link rel="icon" href="../img/logo_circular_ico.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="usuarios">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="../img/logoidv.svg" alt="Logo IDV">
        <div class="sidebar-logo-text">IDV <small>Admin Panel</small></div>
      </div>
      <button class="sidebar-toggle" aria-label="Colapsar menú">
        <i class="fas fa-angles-left" id="toggleIcon"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Principal</div>
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
          <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
        </a>
        <a href="actividades.html" class="nav-item" data-page="actividades">
          <i class="fas fa-calendar-alt"></i><span>Actividades</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Gestión</div>
        <a href="programacion.html" class="nav-item" data-page="programacion">
          <i class="fas fa-clock"></i><span>Programación Semanal</span>
        </a>
        <a href="usuarios.html" class="nav-item active" data-page="usuarios">
          <i class="fas fa-users-cog"></i><span>Usuarios</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-logout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===================== MAIN CONTENT ===================== -->
  <div class="main-content" id="mainContent">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-trigger" id="menuTrigger" aria-label="Abrir menú">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="topbar-title">Usuarios</h1>
      </div>
      <div class="topbar-right">
        <div class="topbar-user">
          <div class="topbar-avatar"><i class="fas fa-user-shield"></i></div>
          <div class="topbar-info">
            <div class="topbar-name" id="userName">Admin</div>
            <div class="topbar-role" id="userRole">Admin</div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">

      <div class="page-header">
        <div>
          <h2>Gestión de Usuarios</h2>
          <div class="breadcrumb">
            <a href="dashboard.html">Dashboard</a>
            <i class="fas fa-chevron-right"></i>
            <span>Usuarios</span>
          </div>
        </div>
        <button class="btn btn-accent" id="btnNuevoUsuario">
          <i class="fas fa-user-plus"></i> Nuevo Usuario
        </button>
      </div>

      <!-- Table -->
      <div class="table-container">
        <div class="table-header">
          <h3>Todos los Usuarios</h3>
          <div class="table-actions">
            <input type="text" class="search-input" id="searchUsuarios" placeholder="Buscar usuario...">
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usuariosBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- ===================== MODAL: Create / Edit Usuario ===================== -->
  <div class="modal-overlay" id="usuarioModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitleUsuario">Nuevo Usuario</h3>
        <button class="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <form class="modal-form" id="usuarioForm" autocomplete="off" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="uNombre">Nombre Completo *</label>
            <input type="text" id="uNombre" name="nombre" placeholder="René Adolfo García" required>
          </div>
          <div class="form-group">
            <label for="uCorreo">Correo Electrónico *</label>
            <input type="email" id="uCorreo" name="correo" placeholder="usuario@idv.org.ni" required>
          </div>
          <div class="form-group" id="passGroup">
            <label for="uPassword">Contraseña *</label>
            <input type="password" id="uPassword" name="password" placeholder="••••••••" required>
          </div>
          <div class="form-group">
            <label for="uRol">Rol *</label>
            <select id="uRol" name="rol" required>
              <option value="Administrador">Administrador</option>
              <option value="Pastor">Pastor</option>
              <option value="Pastora">Pastora</option>
              <option value="Co-Pastor">Co-Pastor</option>
              <option value="Co-Pastora">Co-Pastora</option>
              <option value="Editor">Editor</option>
            </select>
          </div>
          <div class="form-group">
            <label for="uEstado">Estado</label>
            <select id="uEstado" name="estado">
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
