<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E2A67">
  <title>Usuarios — IDV Admin</title>
  <link rel="icon" href="../img/logo_circular_ico.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="usuarios">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="../img/logoidv.svg" alt="Logo IDV">
        <div class="sidebar-logo-text">IDV <small>Admin Panel</small></div>
      </div>
      <button class="sidebar-toggle" aria-label="Colapsar menú">
        <i class="fas fa-angles-left" id="toggleIcon"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Principal</div>
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
          <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
        </a>
        <a href="actividades.html" class="nav-item" data-page="actividades">
          <i class="fas fa-calendar-alt"></i><span>Actividades</span>
        </a>
        <a href="avisos.html" class="nav-item" data-page="avisos">
          <i class="fas fa-bullhorn"></i><span>Avisos</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Gestión</div>
        <a href="programacion.html" class="nav-item" data-page="programacion">
          <i class="fas fa-clock"></i><span>Programación Semanal</span>
        </a>
        <a href="reportes.html" class="nav-item" data-page="reportes">
          <i class="fas fa-chart-line"></i><span>Reportes</span>
        </a>
        <a href="usuarios.html" class="nav-item active" data-page="usuarios">
          <i class="fas fa-users-cog"></i><span>Usuarios</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-logout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===================== MAIN CONTENT ===================== -->
  <div class="main-content" id="mainContent">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-trigger" id="menuTrigger" aria-label="Abrir menú">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="topbar-title">Usuarios</h1>
      </div>
      <div class="topbar-right">
        <div class="topbar-user">
          <div class="topbar-avatar"><i class="fas fa-user-shield"></i></div>
          <div class="topbar-info">
            <div class="topbar-name" id="userName">Admin</div>
            <div class="topbar-role" id="userRole">Admin</div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">

      <div class="page-header">
        <div>
          <h2>Usuarios del Sistema</h2>
          <div class="breadcrumb">
            <a href="dashboard.html">Dashboard</a>
            <i class="fas fa-chevron-right"></i>
            <span>Usuarios</span>
          </div>
        </div>
        <button class="btn btn-outline" id="btnNuevoUsuario">
          <i class="fas fa-circle-info"></i> ¿Cómo agregar usuarios?
        </button>
      </div>

      <!-- Table -->
      <div class="table-container">
        <div class="table-header">
          <h3>Todos los Usuarios</h3>
          <small style="color:var(--text-light);">Datos reales desde Supabase Auth / profiles</small>
          <div class="table-actions">
            <input type="text" class="search-input" id="searchUsuarios" placeholder="Buscar usuario...">
          </div>
        </div>
        <div class="table-wrapper">
          <table class="responsive-table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="usuariosBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
