<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E2A67">
  <title>Avisos — IDV Admin</title>
  <link rel="icon" href="../img/logo_circular_ico.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="avisos">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="../img/logoidv.svg" alt="Logo IDV">
        <div class="sidebar-logo-text">IDV <small>Admin Panel</small></div>
      </div>
      <button class="sidebar-toggle" aria-label="Colapsar menú">
        <i class="fas fa-angles-left" id="toggleIcon"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-section-title">Principal</div>
        <a href="dashboard.html" class="nav-item" data-page="dashboard">
          <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
        </a>
        <a href="actividades.html" class="nav-item" data-page="actividades">
          <i class="fas fa-calendar-alt"></i><span>Actividades</span>
        </a>
        <a href="avisos.html" class="nav-item active" data-page="avisos">
          <i class="fas fa-bullhorn"></i><span>Avisos</span>
        </a>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">Gestión</div>
        <a href="programacion.html" class="nav-item" data-page="programacion">
          <i class="fas fa-clock"></i><span>Programación Semanal</span>
        </a>
        <a href="reportes.html" class="nav-item" data-page="reportes">
          <i class="fas fa-chart-line"></i><span>Reportes</span>
        </a>
        <a href="usuarios.html" class="nav-item" data-page="usuarios">
          <i class="fas fa-users-cog"></i><span>Usuarios</span>
        </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-logout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></button>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===================== MAIN CONTENT ===================== -->
  <div class="main-content" id="mainContent">

    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-trigger" id="menuTrigger" aria-label="Abrir menú">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="topbar-title">Avisos</h1>
      </div>
      <div class="topbar-right">
        <div class="topbar-user">
          <div class="topbar-avatar"><i class="fas fa-user-shield"></i></div>
          <div class="topbar-info">
            <div class="topbar-name" id="userName">Admin</div>
            <div class="topbar-role" id="userRole">Admin</div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-content">

      <div class="page-header">
        <div>
          <h2>Gestión de Avisos</h2>
          <div class="breadcrumb">
            <a href="dashboard.html">Dashboard</a>
            <i class="fas fa-chevron-right"></i>
            <span>Avisos</span>
          </div>
        </div>
        <button class="btn btn-accent" id="btnNuevoAviso">
          <i class="fas fa-plus"></i> Nuevo Aviso
        </button>
      </div>

      <!-- Table -->
      <div class="table-container">
        <div class="table-header">
          <h3>Todos los Avisos</h3>
          <div class="table-actions">
            <input type="text" class="search-input" id="searchAvisos" placeholder="Buscar aviso...">
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Aviso</th>
                <th>Publicación</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="avisosBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- ===================== MODAL: Create / Edit Aviso ===================== -->
  <div class="modal-overlay" id="avisoModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Nuevo Aviso</h3>
        <button class="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <form class="modal-form" id="avisoForm" autocomplete="off" novalidate>
        <div class="modal-body">
          <div class="form-group">
            <label for="avTitulo">Título *</label>
            <input type="text" id="avTitulo" name="titulo" placeholder="Título del aviso" maxlength="150" required>
          </div>
          <div class="form-group">
            <label for="avContenido">Contenido *</label>
            <textarea id="avContenido" name="contenido" placeholder="Escribe el mensaje del aviso..." rows="5" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="avFecha">Fecha de publicación *</label>
              <input type="date" id="avFecha" name="fecha_publicacion" required>
            </div>
            <div class="form-group">
              <label for="avEstado">Estado</label>
              <select id="avEstado" name="estado">
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="avImagen">Imagen (opcional)</label>
            <input type="file" id="avImagen" name="imagen" accept="image/*">
            <small class="form-hint">PNG, JPG, WEBP o SVG. Tamaño máximo: 5 MB.</small>
            <div class="aviso-preview" id="avisoPreviewWrap" hidden>
              <img id="avisoPreview" alt="Vista previa del aviso">
              <button type="button" class="btn-icon delete" id="btnQuitarImagen" title="Quitar imagen">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline btn-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnSaveAviso">
            <i class="fas fa-save"></i> Guardar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/avisos.js"></script>
</body>
</html>
